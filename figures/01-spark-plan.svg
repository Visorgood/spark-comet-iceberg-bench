<svg xmlns="http://www.w3.org/2000/svg" width="760" height="1076" viewBox="0 0 760 1076" role="img" aria-label="In Spark the data is columnar at both ends and rows in between" font-size="11.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Plain Spark, Iceberg to Iceberg: per-row steps highlighted</title>
  <rect id="paper" width="760" height="1076" fill="#FBF8F2"/>
  <defs>
    <marker id="sp-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7A7368"/>
    </marker>
  </defs>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#1E1C19">In Spark the data is columnar at both ends and rows in between</text>
  <g id="legend">
    <rect x="24" y="44" width="24" height="14" rx="3" fill="#C27A0E" fill-opacity="0.12" stroke="#C27A0E" stroke-width="2"/>
    <text x="56" y="55" fill="#6B6459">work done once per row</text>
    <rect x="240" y="44" width="24" height="14" rx="3" fill="none" stroke="#7A7368" stroke-width="1.25"/>
    <text x="272" y="55" fill="#6B6459">work done once per batch, per file or per job</text>
  </g>
  <g id="connectors" fill="none" stroke="#7A7368" stroke-width="1.25">
    <path d="M380 132V190" marker-end="url(#sp-arrow)"/>
    <path d="M380 248V270" marker-end="url(#sp-arrow)"/>
    <path d="M380 328V350" marker-end="url(#sp-arrow)"/>
    <path d="M380 424V446" marker-end="url(#sp-arrow)"/>
    <path d="M380 520V558" marker-end="url(#sp-arrow)"/>
    <path d="M380 616V674" marker-end="url(#sp-arrow)"/>
    <path d="M380 732V754" marker-end="url(#sp-arrow)"/>
    <path d="M380 812V834" marker-end="url(#sp-arrow)"/>
    <path d="M380 892V930" marker-end="url(#sp-arrow)"/>
    <path d="M380 988V1010" marker-end="url(#sp-arrow)"/>
  </g>
  <g id="source-table">
    <rect x="200" y="92" width="360" height="40" rx="8" fill="#EFE8DA" stroke="#7A7368" stroke-width="1.25"/>
    <text x="380" y="117" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1C19">Iceberg table lineitem: Parquet data files</text>
  </g>
  <g id="map-stage">
    <rect x="48" y="156" width="664" height="380" rx="8" fill="none" stroke="#CFC7B8" stroke-width="1.25"/>
    <text x="64" y="180" font-size="13" font-weight="600" fill="#6B6459">Map stage · one task per file split</text>
  </g>
  <g id="step-scan">
    <rect x="84" y="192" width="592" height="56" rx="8" fill="none" fill-opacity="1" stroke="#7A7368" stroke-width="1.25"/>
    <text x="100" y="216" font-size="13" font-weight="600" fill="#1E1C19">BatchScan · Iceberg vectorized reader</text>
    <text x="100" y="232" fill="#1E1C19">decodes Parquet into Arrow vectors on the JVM, 5,000 rows per batch</text>
  </g>
  <g id="step-codegen">
    <rect x="84" y="272" width="592" height="56" rx="8" fill="#C27A0E" fill-opacity="0.12" stroke="#C27A0E" stroke-width="2"/>
    <text x="100" y="296" font-size="13" font-weight="600" fill="#1E1C19">ColumnarToRow → Filter → Project · one generated Java loop</text>
    <text x="100" y="312" fill="#1E1C19">one row per loop iteration; the decimal multiply goes through java.math.BigDecimal</text>
  </g>
  <g id="step-partial-agg">
    <rect x="84" y="352" width="592" height="72" rx="8" fill="#C27A0E" fill-opacity="0.12" stroke="#C27A0E" stroke-width="2"/>
    <text x="100" y="376" font-size="13" font-weight="600" fill="#1E1C19">HashAggregate (partial)</text>
    <text x="100" y="392" fill="#1E1C19">per row: build the key as an UnsafeRow, hash it, probe the map,</text>
    <text x="100" y="408" fill="#1E1C19">update the buffer in place; the map lives in Tungsten memory pages</text>
  </g>
  <g id="step-shuffle-write">
    <rect x="84" y="448" width="592" height="72" rx="8" fill="#C27A0E" fill-opacity="0.12" stroke="#C27A0E" stroke-width="2"/>
    <text x="100" y="472" font-size="13" font-weight="600" fill="#1E1C19">Exchange · BypassMergeSortShuffleWriter (200 partitions)</text>
    <text x="100" y="488" fill="#1E1C19">per row: partition id = Pmod(Murmur3Hash(l_orderkey), 200)</text>
    <text x="100" y="504" fill="#1E1C19">then length + UnsafeRow bytes into one lz4 stream per reducer</text>
  </g>
  <g id="shuffle-files">
    <rect x="84" y="560" width="592" height="56" rx="8" fill="#EFE8DA" stroke="#7A7368" stroke-width="1.25"/>
    <text x="100" y="584" font-size="13" font-weight="600" fill="#1E1C19">Shuffle files on local disk</text>
    <text x="100" y="600" fill="#1E1C19">one data file + one index file per map task; lz4-compressed row bytes</text>
  </g>
  <g id="reduce-stage">
    <rect x="48" y="640" width="664" height="268" rx="8" fill="none" stroke="#CFC7B8" stroke-width="1.25"/>
    <text x="64" y="664" font-size="13" font-weight="600" fill="#6B6459">Reduce stage · one task per shuffle partition</text>
  </g>
  <g id="step-shuffle-read">
    <rect x="84" y="676" width="592" height="56" rx="8" fill="#C27A0E" fill-opacity="0.12" stroke="#C27A0E" stroke-width="2"/>
    <text x="100" y="700" font-size="13" font-weight="600" fill="#1E1C19">Shuffle read</text>
    <text x="100" y="716" fill="#1E1C19">per record: fetch, decompress, hand out an UnsafeRow pointing into the buffer</text>
  </g>
  <g id="step-final-agg">
    <rect x="84" y="756" width="592" height="56" rx="8" fill="#C27A0E" fill-opacity="0.12" stroke="#C27A0E" stroke-width="2"/>
    <text x="100" y="780" font-size="13" font-weight="600" fill="#1E1C19">HashAggregate (final)</text>
    <text x="100" y="796" fill="#1E1C19">per row: probe the map and merge the partial sum and count</text>
  </g>
  <g id="step-writer">
    <rect x="84" y="836" width="592" height="56" rx="8" fill="#C27A0E" fill-opacity="0.12" stroke="#C27A0E" stroke-width="2"/>
    <text x="100" y="860" font-size="13" font-weight="600" fill="#1E1C19">AppendData · iceberg-java Parquet writer</text>
    <text x="100" y="876" fill="#1E1C19">per row: each value into its column&#x27;s page buffer; pages encoded, zstd</text>
  </g>
  <g id="driver-commit">
    <rect x="84" y="932" width="592" height="56" rx="8" fill="none" fill-opacity="1" stroke="#7A7368" stroke-width="1.25"/>
    <text x="100" y="956" font-size="13" font-weight="600" fill="#1E1C19">Driver · Iceberg commit</text>
    <text x="100" y="972" fill="#1E1C19">adds the new data files to a new snapshot of the table</text>
  </g>
  <g id="target-table">
    <rect x="200" y="1012" width="360" height="40" rx="8" fill="#EFE8DA" stroke="#7A7368" stroke-width="1.25"/>
    <text x="380" y="1037" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1C19">Iceberg table order_revenue: new data files</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
