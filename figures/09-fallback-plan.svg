<svg xmlns="http://www.w3.org/2000/svg" width="760" height="700" viewBox="0 0 760 700" role="img" aria-label="One unsupported expression sends the rest of the job to Spark" font-size="11.5" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>One unsupported expression sends the rest of the job to Spark</title>
  <rect id="paper" width="760" height="700" fill="#FBF8F2"/>
  <defs>
    <marker id="mix-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7A7368"/>
    </marker>
  </defs>
  <text x="24" y="28" font-size="15" font-weight="600" fill="#1E1C19">One unsupported expression sends the rest of the job to Spark</text>
  <text x="24" y="48" fill="#6B6459">Plan of the comet-fallback run, Comet 1.2.0 · dashed: what the comet run kept native</text>
  <g id="lanes">
    <line x1="263" y1="66" x2="263" y2="632" stroke="#CFC7B8" stroke-dasharray="4 4"/>
    <line x1="489" y1="66" x2="489" y2="632" stroke="#CFC7B8" stroke-dasharray="4 4"/>
    <text x="136" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#6B6459">Arrow batches · Rust</text>
    <text x="380" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#6B6459">conversions · JVM</text>
    <text x="612" y="80" text-anchor="middle" font-size="13" font-weight="600" fill="#6B6459">rows · Spark</text>
  </g>
  <g id="stage-boundary">
    <line x1="24" y1="458" x2="736" y2="458" stroke="#CFC7B8" stroke-dasharray="2 4"/>
    <text x="380" y="416" text-anchor="middle" fill="#6B6459">map stage</text>
    <text x="380" y="508" text-anchor="middle" fill="#6B6459">reduce stage</text>
  </g>
  <g id="connectors" fill="none" stroke="#7A7368" stroke-width="1.25">
    <path d="M136 172V182H380V192" marker-end="url(#mix-arrow)"/>
    <path d="M380 264V274H612V284" marker-end="url(#mix-arrow)"/>
    <path d="M612 356V366H612V376" marker-end="url(#mix-arrow)"/>
    <path d="M612 448V458H612V468" marker-end="url(#mix-arrow)"/>
    <path d="M612 540V550H612V560" marker-end="url(#mix-arrow)"/>
  </g>
  <g id="scan">
    <rect x="24" y="100" width="224" height="72" rx="8" fill="#0F7F72" fill-opacity="0.12" stroke="#0F7F72" stroke-width="2" stroke-dasharray="none"/>
    <text x="136" y="130" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1C19">CometIcebergNativeScan</text>
    <text x="136" y="150" text-anchor="middle" fill="#1E1C19">Arrow batches from Iceberg</text>
  </g>
  <g id="c2r">
    <rect x="278" y="192" width="204" height="72" rx="8" fill="#C27A0E" fill-opacity="0.12" stroke="#C27A0E" stroke-width="2" stroke-dasharray="none"/>
    <text x="380" y="222" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1C19">CometColumnarToRow</text>
    <text x="380" y="242" text-anchor="middle" fill="#1E1C19">per row: Arrow to UnsafeRow</text>
  </g>
  <g id="spark-ops">
    <rect x="496" y="284" width="232" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7A7368" stroke-width="1.25" stroke-dasharray="none"/>
    <text x="612" y="308" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1C19">Spark codegen, per row</text>
    <text x="612" y="328" text-anchor="middle" fill="#1E1C19">Filter (assert_true), Project,</text>
    <text x="612" y="344" text-anchor="middle" fill="#1E1C19">HashAggregate (partial)</text>
  </g>
  <g id="spark-exchange">
    <rect x="496" y="376" width="232" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7A7368" stroke-width="1.25" stroke-dasharray="none"/>
    <text x="612" y="400" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1C19">Exchange</text>
    <text x="612" y="420" text-anchor="middle" fill="#1E1C19">Spark shuffle of UnsafeRows</text>
    <text x="612" y="436" text-anchor="middle" fill="#1E1C19">Comet reverts its JVM shuffle</text>
  </g>
  <g id="final-agg">
    <rect x="496" y="468" width="232" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7A7368" stroke-width="1.25" stroke-dasharray="none"/>
    <text x="612" y="498" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1C19">HashAggregate</text>
    <text x="612" y="518" text-anchor="middle" fill="#1E1C19">final, per row</text>
  </g>
  <g id="write">
    <rect x="496" y="560" width="232" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7A7368" stroke-width="1.25" stroke-dasharray="none"/>
    <text x="612" y="584" text-anchor="middle" font-size="13" font-weight="600" fill="#1E1C19">IcebergWrite</text>
    <text x="612" y="604" text-anchor="middle" fill="#1E1C19">iceberg-java writes the files</text>
    <text x="612" y="620" text-anchor="middle" fill="#1E1C19">native write needs native input</text>
  </g>
  <g id="lost-native">
    <text x="136" y="270" text-anchor="middle" fill="#6B6459">the comet run kept these native</text>
    <rect x="24" y="284" width="224" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7A7368" stroke-width="1.25" stroke-dasharray="4 4"/>
    <text x="136" y="316" text-anchor="middle" fill="#6B6459">CometFilter, CometProject,</text>
    <text x="136" y="334" text-anchor="middle" fill="#6B6459">CometHashAggregate (partial)</text>
    <rect x="24" y="376" width="224" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7A7368" stroke-width="1.25" stroke-dasharray="4 4"/>
    <text x="136" y="408" text-anchor="middle" fill="#6B6459">CometExchange</text>
    <text x="136" y="426" text-anchor="middle" fill="#6B6459">native shuffle</text>
    <rect x="24" y="468" width="224" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7A7368" stroke-width="1.25" stroke-dasharray="4 4"/>
    <text x="136" y="500" text-anchor="middle" fill="#6B6459">CometHashAggregate</text>
    <text x="136" y="518" text-anchor="middle" fill="#6B6459">final</text>
    <rect x="24" y="560" width="224" height="72" rx="8" fill="none" fill-opacity="1" stroke="#7A7368" stroke-width="1.25" stroke-dasharray="4 4"/>
    <text x="136" y="592" text-anchor="middle" fill="#6B6459">CometIcebergWrite</text>
    <text x="136" y="610" text-anchor="middle" fill="#6B6459">native write</text>
  </g>
  <text x="24" y="664" fill="#6B6459">Within a stage, Comet runs an operator natively only if its input is native; by default it turns rows into Arrow only above a scan.</text>
  <text x="24" y="682" fill="#6B6459">Same query at SF 100 on 8 cores: spark 38.7 s, comet 10.5 s, comet-fallback 34.8 s.</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
